[project]
name = "go2-dispatcher"
version = "0.1.0"
requires-python = ">=3.10,<3.11"          # see docs/setup.md
dependencies = [
  "anthropic",                            # current major; pin in uv.lock
  "httpx",
  "httpx2",                               # used directly by llm.py (anthropic SDK transport)
  "pydantic>=2",
  "PyYAML",
  "python-telegram-bot>=22.8,<23",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
robot  = ["unitree_sdk2py"]
vision = ["ultralytics", "opencv-python", "numpy"]

[project.scripts]
go2 = "dispatcher.transports.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",             # type checker; pip wheel bundles its own Node
    "import-linter>=2.15",
    "pytest",
    "pytest-cov>=7.1",                  # pulls coverage >= 7.10 for [run] patch
    "pytest-timeout",
    "ruff>=0.16",
]

[tool.uv.sources]
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dispatcher", "skills", "contract", "services"]
exclude = ["dispatcher/docs", "dispatcher/tests", "skills/docs", "skills/tests", "skills/catalog", "contract/docs", "contract/tests", "services/robot/docs", "services/robot/tests", "services/vision/docs", "services/vision/tests", "services/backend/docs", "services/backend/tests"]

[tool.pytest.ini_options]
testpaths = ["dispatcher/tests", "skills/tests", "contract/tests", "services/robot/tests", "services/vision/tests", "services/backend/tests", "tests", ".claude/hooks/tests", ".claude/scripts/tests"]
addopts = "-p tests.pytest_plugin"   # options and marker gating (tests/docs/testing.md)
timeout = 30
markers = [
  "integration: spawns real subprocesses with the stub backend",
  "live_llm: calls the real Anthropic API (needs --run-live and ANTHROPIC_API_KEY)",
  "robot: needs the real Go2 (needs --run-robot)",
]

[tool.coverage.run]                     # opt-in: uv run pytest --cov (tests/docs/testing.md)
source = ["dispatcher", "skills", "contract", "services"]
branch = true
patch = ["subprocess", "_exit"]         # measure skill and CLI subprocesses; skills end with os._exit

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]                     # import boundaries: uv run lint-imports (tests/docs/testing.md)
root_packages = ["skills", "dispatcher", "contract", "services", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Skills import only the client surfaces of robot and vision, and no heavy or dispatcher-side package"
type = "forbidden"                      # a skill process stays light and reaches the robot and the detector only through the services
source_modules = ["skills"]
forbidden_modules = [
  "dispatcher", "pydantic", "yaml",
  "unitree_sdk2py", "cyclonedds", "torch", "ultralytics", "cv2",
  "services.robot.service", "services.robot.backends", "services.robot.local", "services.robot.lease", "services.robot.stop_move", "services.robot.read_state",
  "services.vision.service", "services.vision.detectors", "services.vision.boxes",
  "services.robot.stub", "services.backend",   # the stub world stays off a skill process's import graph
]
ignore_imports = [
  "contract.manifest -> pydantic",   # skills.tests may import the parser; skill code may not (protected below)
  "contract.manifest -> yaml",       # same reason
]

[[tool.importlinter.contracts]]
name = "The robot and vision services are independent of each other"
type = "independence"
modules = ["services.robot", "services.vision"]

[[tool.importlinter.contracts]]
name = "The shared backend package imports neither service, skills nor the dispatcher"
type = "forbidden"                      # both services import it, so it stays below them
source_modules = ["services.backend"]
forbidden_modules = ["services.robot", "services.vision", "skills", "dispatcher"]

[[tool.importlinter.contracts]]
name = "The services import neither skills nor the dispatcher"
type = "forbidden"
source_modules = ["services"]
forbidden_modules = ["skills", "dispatcher"]

[[tool.importlinter.contracts]]
name = "The dispatcher imports only the client surfaces of robot and vision"
type = "forbidden"
source_modules = ["dispatcher"]
forbidden_modules = [
  "services.robot.service", "services.robot.backends", "services.robot.local", "services.robot.lease", "services.robot.stop_move", "services.robot.read_state",
  "services.vision.service", "services.vision.detectors", "services.vision.boxes",
]
ignore_imports = [
  "dispatcher.executor -> services.robot.stop_move",   # exception, to be removed: the utilities' module name and POLICY; the import also loads services.robot.local and services.robot.backends.sim
  "dispatcher.executor -> services.robot.read_state",   # same reason
  "dispatcher.transports.telegram_bot -> services.robot.stop_move",   # same reason
  "dispatcher.tests.unit.test_telegram_bot -> services.robot.stop_move",   # same reason: the unit test of the transport reads POLICY
]

[[tool.importlinter.contracts]]
name = "The dispatcher reaches the stub world only through the robot's stub control"
type = "forbidden"                      # direct imports only: services.robot.stub itself imports services.backend.stub_state
source_modules = ["dispatcher"]
forbidden_modules = ["services.backend"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the vision service imports the detector stack"
type = "protected"                      # no other process loads torch, ultralytics or cv2
protected_modules = ["services.vision.detectors", "services.vision.service", "ultralytics", "cv2"]
allowed_importers = ["services.vision.service", "services.vision.detectors", "services.vision.tests"]

[[tool.importlinter.contracts]]
name = "Shared test helpers import no project package"
type = "forbidden"                      # every package's tests import tests.helpers; a project import there links the packages
source_modules = ["tests.helpers"]
forbidden_modules = ["dispatcher", "skills", "services", "contract"]

[[tool.importlinter.contracts]]
name = "Contract imports no other project package"
type = "forbidden"                      # tests is listed so no chain through tests.helpers hides one
source_modules = ["contract"]
forbidden_modules = ["skills", "dispatcher", "services", "tests"]

[[tool.importlinter.contracts]]
name = "Contract imports neither pydantic nor yaml, except the SKILL.md parser"
type = "forbidden"
source_modules = ["contract"]
forbidden_modules = ["pydantic", "yaml"]
ignore_imports = [
  "contract.manifest -> pydantic",   # the SKILL.md parser runs in the dispatcher only
  "contract.manifest -> yaml",       # same reason
]

[[tool.importlinter.contracts]]
name = "Only the dispatcher and skill tests import the SKILL.md parser"
type = "protected"                      # the ignored imports above hide a chain through the parser; this closes it
protected_modules = ["contract.manifest"]
allowed_importers = ["dispatcher", "skills.tests", "contract.tests"]

[tool.basedpyright]                     # type check: uv run basedpyright (tests/docs/testing.md)
include = ["dispatcher", "skills", "contract", "services", "tests"]
exclude = ["**/__pycache__", "**/.*"]   # replaces the defaults; .venv and caches sit outside include anyway
typeCheckingMode = "basic"
pythonVersion = "3.10"

[tool.ruff]                             # lint and format (tests/docs/testing.md)
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"dispatcher/prompts.py" = ["E501"]   # fixed texts; rewrapping changes the registry hash (skills/docs/skills.md)
