[project]
name = "go2-dispatcher"
version = "0.1.0"
requires-python = ">=3.10,<3.11"          # see docs/setup.md
dependencies = [
  "anthropic",                            # current major; pin in uv.lock
  "httpx",
  "httpx2",                               # used directly by llm.py (anthropic SDK transport)
  "pydantic>=2",
  "PyYAML",
  "python-telegram-bot>=22.8,<23",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
robot  = ["unitree_sdk2py"]
vision = ["ultralytics", "opencv-python", "numpy"]

[project.scripts]
go2 = "dispatcher.transports.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest",
    "pytest-cov>=7.1",                  # pulls coverage >= 7.10 for [run] patch
    "pytest-timeout",
    "ruff>=0.16",
]

[tool.uv.sources]
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dispatcher", "skills"]
exclude = ["dispatcher/docs", "dispatcher/tests", "skills/docs", "skills/tests", "skills/catalog"]

[tool.pytest.ini_options]
testpaths = ["dispatcher/tests", "skills/tests", "tests"]
addopts = "-p tests.pytest_plugin"   # options and marker gating (tests/docs/testing.md)
timeout = 30
markers = [
  "integration: spawns real subprocesses with the stub backend",
  "live_llm: calls the real Anthropic API (needs --run-live and ANTHROPIC_API_KEY)",
  "robot: needs the real Go2 (needs --run-robot)",
]

[tool.coverage.run]                     # opt-in: uv run pytest --cov (tests/docs/testing.md)
source = ["dispatcher", "skills"]
branch = true
patch = ["subprocess", "_exit"]         # measure skill and CLI subprocesses; skills end with os._exit

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]                     # import boundaries: uv run lint-imports (tests/docs/testing.md)
root_packages = ["skills", "dispatcher"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Skills import neither the dispatcher, pydantic nor yaml"
type = "forbidden"
source_modules = ["skills"]
forbidden_modules = ["dispatcher", "pydantic", "yaml"]
ignore_imports = [
  "skills.frontmatter -> pydantic",     # the SKILL.md parser runs in the dispatcher only
  "skills.frontmatter -> yaml",
]

[[tool.importlinter.contracts]]
name = "Only the dispatcher and skill tests import the SKILL.md parser"
type = "protected"                      # a forbidden contract skips skills -> skills.frontmatter as overlapping
protected_modules = ["skills.frontmatter"]
allowed_importers = ["dispatcher", "skills.tests"]

[tool.ruff]                             # lint and format (tests/docs/testing.md)
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"dispatcher/prompts.py" = ["E501"]   # fixed texts; rewrapping changes the registry hash (skills/docs/skills.md)
