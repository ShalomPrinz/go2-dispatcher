[project]
name = "go2-dispatcher"
version = "0.1.0"
requires-python = ">=3.10,<3.11"          # see docs/setup.md
dependencies = [
  "anthropic",                            # current major; pin in uv.lock
  "httpx",
  "httpx2",                               # used directly by dispatcher/llm/anthropic_planner.py (anthropic SDK transport)
  "pydantic>=2",
  "typing_extensions>=4.1",               # assert_never in dispatcher/runlog/writer.py (no typing.assert_never on 3.10)
  "PyYAML",
  "python-telegram-bot>=22.8,<23",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
robot  = ["unitree_sdk2py"]
vision = ["ultralytics", "opencv-python", "numpy"]

[project.scripts]
go2 = "dispatcher.transports.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",             # type checker; pip wheel bundles its own Node
    "import-linter>=2.15",
    "pytest",
    "pytest-cov>=7.1",                  # pulls coverage >= 7.10 for [run] patch
    "pytest-timeout",
    "ruff>=0.16",
]

[tool.uv.sources]
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dispatcher", "skills", "contract", "services", "analysis"]
exclude = ["dispatcher/docs", "dispatcher/tests", "skills/docs", "skills/tests", "skills/*/SKILL.md", "contract/docs", "contract/tests", "services/robot/docs", "services/robot/tests", "services/vision/docs", "services/vision/tests", "services/backend/docs", "services/backend/tests", "analysis/docs", "analysis/tests"]

[tool.pytest.ini_options]
testpaths = ["dispatcher/tests", "skills/tests", "contract/tests", "services/robot/tests", "services/vision/tests", "services/backend/tests", "analysis/tests", "tests", ".claude/hooks/tests", ".claude/scripts/tests"]
addopts = "-p tests.pytest_plugin"   # options and marker gating (tests/docs/testing.md)
timeout = 30
markers = [
  "integration: spawns real subprocesses with the stub backend",
  "live_llm: calls the real Anthropic API (needs --run-live and ANTHROPIC_API_KEY)",
  "robot: needs the real Go2 (needs --run-robot)",
]

[tool.coverage.run]                     # opt-in: uv run pytest --cov (tests/docs/testing.md)
source = ["dispatcher", "skills", "contract", "services", "analysis"]
branch = true
patch = ["subprocess", "_exit"]         # measure skill and CLI subprocesses; skills end with os._exit

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]                     # import boundaries: uv run lint-imports (tests/docs/testing.md)
root_packages = ["skills", "dispatcher", "contract", "services", "analysis", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Skills import only the client surfaces of robot and vision, and no heavy or dispatcher-side package"
type = "forbidden"                      # a skill process stays light and reaches the robot and the detector only through the services
source_modules = ["skills"]
forbidden_modules = [
  "dispatcher", "analysis", "pydantic", "yaml",
  "unitree_sdk2py", "cyclonedds", "torch", "ultralytics", "cv2",
  "services.robot.service", "services.robot.backends", "services.robot.lease", "services.robot.stop_move", "services.robot.read_state",
  "services.vision.service", "services.vision.detectors", "services.vision.boxes",
  "services.robot.stub", "services.backend",   # the stub world stays off a skill process's import graph
]
ignore_imports = [
  "contract.manifest -> pydantic",   # skills.tests may import the parser; skill code may not (protected below)
  "contract.manifest -> yaml",       # same reason
]

[[tool.importlinter.contracts]]
name = "The robot and vision services are independent of each other"
type = "independence"
modules = ["services.robot", "services.vision"]

[[tool.importlinter.contracts]]
name = "The shared backend package imports neither service, skills nor the dispatcher"
type = "forbidden"                      # both services import it, so it stays below them
source_modules = ["services.backend"]
forbidden_modules = ["services.robot", "services.vision", "skills", "dispatcher"]

[[tool.importlinter.contracts]]
name = "The real backend loads no sim or fault code"
type = "forbidden"                      # a real robot process never loads fault injection (services/robot/docs/service.md)
source_modules = ["services.robot.backends.real"]
forbidden_modules = ["services.robot.backends.sim", "services.robot.backends.faults", "contract.faults"]
allow_indirect_imports = true           # load() imports both backends lazily; the runtime proof is a subprocess test (tests/docs/testing.md)

[[tool.importlinter.contracts]]
name = "The robot service gets faults only through the backend object"
type = "forbidden"
source_modules = ["services.robot.service"]
forbidden_modules = ["services.robot.backends.faults", "contract.faults"]
allow_indirect_imports = true           # same reason

[[tool.importlinter.contracts]]
name = "Only the sim backend and robot tests import the robot fault code"
type = "protected"                      # direct imports only; the two contracts above and the subprocess test cover chains
protected_modules = ["services.robot.backends.faults"]
allowed_importers = ["services.robot.backends.sim", "services.robot.tests", "tests.integration"]

[[tool.importlinter.contracts]]
name = "The services import neither skills, the dispatcher nor analysis"
type = "forbidden"
source_modules = ["services"]
forbidden_modules = ["skills", "dispatcher", "analysis"]

[[tool.importlinter.contracts]]
name = "The dispatcher imports no skill"
type = "forbidden"                      # the registry loads skill entrypoints by name at run time; a static import would hide a dependency
source_modules = ["dispatcher"]
forbidden_modules = ["skills"]

[[tool.importlinter.contracts]]
name = "The dispatcher imports only the client surfaces of robot and vision"
type = "forbidden"
source_modules = ["dispatcher"]
forbidden_modules = [
  "services.robot.service", "services.robot.backends", "services.robot.lease", "services.robot.stop_move", "services.robot.read_state",
  "services.vision.service", "services.vision.detectors", "services.vision.boxes",
]

[[tool.importlinter.contracts]]
name = "The dispatcher reaches the stub world only through the robot's stub control"
type = "forbidden"                      # direct imports only: services.robot.stub itself imports services.backend.stub_state
source_modules = ["dispatcher"]
forbidden_modules = ["services.backend"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the composition root, execution and the registry import the services"
type = "forbidden"                      # every other dispatcher module gets robot and vision through dispatcher.app (dispatcher/docs)
source_modules = [
  "dispatcher.dispatcher", "dispatcher.planning", "dispatcher.llm", "dispatcher.context", "dispatcher.runlog",
  "dispatcher.transports", "dispatcher.config", "dispatcher.models", "dispatcher.prompts",
  "dispatcher.operator_messages", "dispatcher.process_lock",
]
forbidden_modules = ["services"]
allow_indirect_imports = true           # the transports reach services through dispatcher.app -> dispatcher.execution; direct imports are the rule

[[tool.importlinter.contracts]]
name = "Planning and llm are independent of each other"
type = "independence"                   # directly or through any chain; a plan never depends on a provider, a provider never on the plan
modules = ["dispatcher.planning", "dispatcher.llm"]

[[tool.importlinter.contracts]]
name = "Planning imports no run-time, provider or transport package"
type = "forbidden"                      # it may import contract, dispatcher.registry, dispatcher.prompts and dispatcher.models; dispatcher.llm is covered by the independence contract
source_modules = ["dispatcher.planning"]
forbidden_modules = [
  "dispatcher.context", "dispatcher.runlog", "dispatcher.execution",
  "dispatcher.transports", "dispatcher.dispatcher", "anthropic", "httpx",
]

[[tool.importlinter.contracts]]
name = "Llm imports no planning, context, registry, run-time or transport module"
type = "forbidden"                      # dispatcher.planning is covered by the independence contract
source_modules = ["dispatcher.llm"]
forbidden_modules = [
  "dispatcher.context", "dispatcher.registry", "dispatcher.runlog", "dispatcher.execution",
  "dispatcher.transports", "dispatcher.dispatcher",
]

[[tool.importlinter.contracts]]
name = "Only the vision service imports the detector stack"
type = "protected"                      # no other process loads torch, ultralytics or cv2
protected_modules = ["services.vision.detectors", "services.vision.service", "ultralytics", "cv2"]
allowed_importers = ["services.vision.service", "services.vision.detectors", "services.vision.tests"]

[[tool.importlinter.contracts]]
name = "The analysis package reads logs only"
type = "forbidden"                      # it imports dispatcher.runlog (file-format constants) and dispatcher.config (Provider) and nothing else of the run time
source_modules = ["analysis"]
forbidden_modules = [
  "dispatcher.registry", "dispatcher.execution", "dispatcher.app", "dispatcher.dispatcher", "dispatcher.planning",
  "dispatcher.llm", "dispatcher.context", "dispatcher.transports", "skills", "services",
]
allow_indirect_imports = true           # dispatcher.runlog imports dispatcher.context and dispatcher.llm for type checking, which reach the registry; direct imports are the rule

[[tool.importlinter.contracts]]
name = "Only the CLI imports analysis"
type = "protected"                      # direct imports only; the run-log report is reached through go2 report
protected_modules = ["analysis"]
allowed_importers = ["dispatcher.transports.cli", "tests"]

[[tool.importlinter.contracts]]
name = "Shared test helpers import no project package"
type = "forbidden"                      # every package's tests import tests.helpers; a project import there links the packages
source_modules = ["tests.helpers"]
forbidden_modules = ["dispatcher", "skills", "services", "contract", "analysis"]

[[tool.importlinter.contracts]]
name = "Contract imports no other project package"
type = "forbidden"                      # tests is listed so no chain through tests.helpers hides one
source_modules = ["contract"]
forbidden_modules = ["skills", "dispatcher", "services", "analysis", "tests"]

[[tool.importlinter.contracts]]
name = "Contract imports neither pydantic nor yaml, except the SKILL.md parser"
type = "forbidden"
source_modules = ["contract"]
forbidden_modules = ["pydantic", "yaml"]
ignore_imports = [
  "contract.manifest -> pydantic",   # the SKILL.md parser runs in the dispatcher only
  "contract.manifest -> yaml",       # same reason
]

[[tool.importlinter.contracts]]
name = "Only the dispatcher and skill tests import the SKILL.md parser"
type = "protected"                      # the ignored imports above hide a chain through the parser; this closes it
protected_modules = ["contract.manifest"]
allowed_importers = ["dispatcher", "skills.tests", "contract.tests"]

[tool.basedpyright]                     # type check: uv run basedpyright (tests/docs/testing.md)
include = ["dispatcher", "skills", "contract", "services", "analysis", "tests"]
exclude = ["**/__pycache__", "**/.*"]   # replaces the defaults; .venv and caches sit outside include anyway
typeCheckingMode = "basic"
pythonVersion = "3.10"

[tool.ruff]                             # lint and format (tests/docs/testing.md)
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"dispatcher/prompts.py" = ["E501"]   # fixed texts; rewrapping changes the registry hash (skills/docs/skills.md)
